[project]
name = "alpha-qlib-worker"
version = "0.1.0"
description = "Isolated JSON/Parquet worker boundary for Project ALPHA cross-sectional ML."
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightgbm==4.6.0",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "polars==1.41.2",
    "pyqlib==0.9.7",
]

[project.scripts]
alpha-qlib-worker = "alpha_qlib_worker.__main__:main"

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "pandas-stubs==2.3.3.251219",
    "pytest==9.1.0",
    "ruff==0.15.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_qlib_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["alpha_qlib_worker"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "qlib.*"]
ignore_missing_imports = true
