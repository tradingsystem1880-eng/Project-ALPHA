[project]
name = "alpha-rdagent-conformance"
version = "0.1.0"
description = "Development-only pinned native LoopBase conformance; no dispatch route."
requires-python = ">=3.12,<3.13"
dependencies = [
    "dill==0.4.0",
    "filelock==3.20.0",
    "fuzzywuzzy==0.18.0",
    "Jinja2==3.1.6",
    "loguru==0.7.3",
    "psutil==7.2.2",
    "pydantic-settings==2.12.0",
    "pytz==2025.2",
    "PyYAML==6.0.3",
    "regex==2026.4.4",
    "tqdm==4.67.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
