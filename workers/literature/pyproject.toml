[project]
name = "alpha-literature-worker"
version = "0.1.0"
description = "Isolated, fail-closed literature metadata/acquisition worker for Project ALPHA."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
literature-worker = "literature_worker.__main__:main"

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "pytest==9.1.0",
    "ruff==0.15.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/literature_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --import-mode=importlib"
markers = ["network: live network tests against approved metadata services (opt-in)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["literature_worker"]
