[project]
name = "alpha-patterns"
version = "1.0.0"
description = "Chart-pattern detection: swing structure, triple taps, trendlines, order blocks, FVGs."
requires-python = ">=3.12"
dependencies = [
    "alpha-core",
    "numpy>=2.4.6",
    "polars>=1.0",
]

[tool.uv.sources]
alpha-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_patterns"]
