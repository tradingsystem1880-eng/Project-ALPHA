[project]
name = "alpha-study"
version = "1.0.0"
description = "Governed research-study composition and projections."
requires-python = ">=3.12"
dependencies = [
    "alpha-core",
    "alpha-research",
]

[tool.uv.sources]
alpha-core = { workspace = true }
alpha-research = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_study"]
