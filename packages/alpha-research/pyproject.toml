[project]
name = "alpha-research"
version = "1.0.0"
description = "Deterministic, point-in-time-valid strategy research primitives."
requires-python = ">=3.12"
dependencies = [
    "alpha-core",
    "matplotlib>=3.9",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]

[tool.uv.sources]
alpha-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_research"]
