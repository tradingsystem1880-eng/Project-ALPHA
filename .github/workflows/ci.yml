name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Lockfile check
        run: uv lock --check
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Architecture
        run: uv run lint-imports
      - name: Types
        run: uv run mypy packages apps tests
      - name: Tests + 93% owned-source coverage (incl. bias guards)
        run: uv run pytest -q -m "not network" --cov --cov-report=term-missing
      - name: OpenAPI freshness
        run: uv run python scripts/generate_web_openapi.py --check
      - name: OpenAPI verification and authority documentation
        run: uv run python scripts/check_openapi_operations.py
      - name: Build all 13 wheels
        run: uv build --all-packages
      - name: Import built wheels
        run: |
          uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
          .venv/bin/python -c 'import alpha_core, alpha_data, alpha_strategies, alpha_backtest, alpha_validation, alpha_forecast, alpha_options, alpha_screener, alpha_research, alpha_patterns, alpha_cli, alpha_mcp, alpha_web; assert all(m.__version__ == "1.0.0" for m in (alpha_core, alpha_data, alpha_strategies, alpha_backtest, alpha_validation, alpha_forecast, alpha_options, alpha_screener, alpha_research, alpha_patterns, alpha_cli, alpha_mcp, alpha_web))'

  harness:
    # The Claude Code harness verifies itself: a control that is not tested is prose.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Harness doctor
        run: uv run python scripts/gate.py doctor --json
      - name: Harness weakening scanner
        run: uv run python scripts/gate.py lint-harness
      - name: Harness types
        run: uv run mypy --strict scripts/gate.py scripts/claude_hooks.py scripts/harness_models.py .claude/statusline.py
      - name: Block smoke (real hooks must refuse the three canonical bypasses)
        run: |
          set -u
          git config user.email ci@example.com && git config user.name CI
          echo "smoke = 1" > smoke_ci.py && git add smoke_ci.py
          # 1. commit without a gate stamp
          if echo '{"cwd":"'$PWD'","session_id":"ci","tool_input":{"command":"git commit -m \"feat: smoke\""}}' | python3 scripts/claude_hooks.py pre-bash-guard; then echo "commit without stamp was NOT blocked" >&2; exit 1; fi
          # 2. protected edit without ack
          if echo '{"cwd":"'$PWD'","session_id":"ci","tool_input":{"file_path":"'$PWD'/.claude/settings.json","content":"{}"}}' | python3 scripts/claude_hooks.py pre-edit-guard; then echo "protected edit without ack was NOT blocked" >&2; exit 1; fi
          # 3. malformed attestation
          if echo '{"verdict":"MAYBE"}' | uv run python scripts/gate.py attest --kind review; then echo "malformed attestation was NOT rejected" >&2; exit 1; fi
          git rm -q --cached smoke_ci.py && rm smoke_ci.py
          echo "block smoke OK"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install frontend (locked)
        working-directory: apps/alpha-web/frontend
        run: npm ci
      - name: Lint (zero warnings)
        working-directory: apps/alpha-web/frontend
        run: npm run lint -- --deny-warnings
      - name: Frontend tests + V8 coverage floors
        working-directory: apps/alpha-web/frontend
        run: npm run test:coverage
      - name: Generated TypeScript freshness
        working-directory: apps/alpha-web/frontend
        run: npm run generate:api && git diff --exit-code -- src/api/generated.ts
      - name: Install Playwright Chromium
        working-directory: apps/alpha-web/frontend
        run: npx playwright install --with-deps chromium
      - name: Browser release gate (build, six desks, layouts, axe)
        working-directory: apps/alpha-web/frontend
        run: npm run test:e2e
      - name: Committed SPA asset freshness
        run: git diff --exit-code -- apps/alpha-web/src/alpha_web/static/app

  qlib-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workers/qlib
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install isolated worker (locked)
        run: uv sync --locked
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Worker tests
        run: uv run pytest -q

  literature-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/literature
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install isolated worker (locked)
        run: uv sync --locked
      - name: Lockfile check
        run: uv lock --check
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Offline worker and hostile-document tests
        run: uv run pytest -q -m "not network"
