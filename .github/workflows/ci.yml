name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Shared backend gate
        env:
          ALPHA_GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run python scripts/gate.py component backend

  harness:
    # Real Git guards and thin optional agent adapters verify themselves.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Harness doctor
        run: uv run python scripts/gate.py doctor --json
      - name: Harness weakening scanner
        run: uv run python scripts/gate.py lint-harness
      - name: Harness types
        run: uv run mypy --strict $(uv run python -c "import sys; sys.path.insert(0, 'scripts'); import gate; print(' '.join(gate.HARNESS_SCRIPTS))")
      - name: Git guard and adapter acceptance (disposable repositories)
        run: uv run pytest -q tests/unit/test_git_guard.py tests/unit/test_gate_components.py tests/unit/test_claude_harness_hooks_subprocess.py

  frontend:
    runs-on: ubuntu-latest
    # 308 browser tests across four viewport projects; PR #53 hit 15 minutes inside the browser step.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install backend for the Playwright real server (locked)
        run: uv sync --locked
      - name: Install Playwright Chromium
        working-directory: apps/alpha-web/frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Shared frontend gate
        run: uv run python scripts/gate.py component frontend

  qlib-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install gate environment
        run: uv sync --locked
      - name: Shared Qlib gate
        run: uv run python scripts/gate.py component qlib

  literature-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install gate environment
        run: uv sync --locked
      - name: Shared literature gate
        run: uv run python scripts/gate.py component literature

  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Shared Atlas gate
        run: uv run python scripts/gate.py component atlas

  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Shared benchmark (alpha-eval) gate
        run: uv run python scripts/gate.py component eval
