name: xdist probe (temporary)

# TEMPORARY measurement for the lean-checks pull request; deleted before review.
on:
  pull_request:

jobs:
  xdist-probe:
    # TEMPORARY measurement (removed before review): the whole suite on one runner with more
    # xdist workers than cores, to compare against the four shards.
    name: xdist-probe (-n ${{ matrix.workers }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        workers: [4, 8]
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/setup
      - run: >-
          uv run python scripts/run_owned_test.py -- uv run pytest -q -n ${{ matrix.workers }}
          --dist worksteal -m "not network and not slow_oracle" --cov --cov-report=
