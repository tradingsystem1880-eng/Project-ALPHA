[project]
name = "project-alpha"
version = "1.0.0"
description = "Personal quantitative research platform (backtest + validation + paper)."
requires-python = ">=3.12"
dependencies = [
    "alpha-core",
    "alpha-data",
    "alpha-strategies",
    "alpha-backtest",
    "alpha-validation",
    "alpha-forecast",
    "alpha-options",
    "alpha-patterns",
    "alpha-screener",
    "alpha-research",
    "alpha-cli",
    "alpha-mcp",
    "alpha-web",
]

[tool.uv]
package = false  # virtual workspace root; not itself an installable package

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
alpha-core = { workspace = true }
alpha-data = { workspace = true }
alpha-strategies = { workspace = true }
alpha-backtest = { workspace = true }
alpha-validation = { workspace = true }
alpha-forecast = { workspace = true }
alpha-options = { workspace = true }
alpha-patterns = { workspace = true }
alpha-screener = { workspace = true }
alpha-research = { workspace = true }
alpha-cli = { workspace = true }
alpha-mcp = { workspace = true }
alpha-web = { workspace = true }
# CI (ubuntu) must never resolve CUDA torch wheels (~2.5GB + nvidia-* deps); macOS PyPI
# wheels are already CPU+MPS, so the CPU index is gated to linux only.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.1",
    "pandas-stubs>=2.0",
    "pytest-cov>=6",
    "httpx2>=0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# vendored upstream Kronos model code is pinned verbatim (see alpha_forecast._vendor) — not ours to
# style; the Workstation SPA source (apps/alpha-web/frontend) is TypeScript, linted by its own npm
# toolchain, not ruff — its built assets are committed under src/alpha_web/static/app.
extend-exclude = [
    "packages/alpha-forecast/src/alpha_forecast/_vendor",
    "apps/alpha-web/frontend",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["alpha_core", "alpha_patterns", "alpha_data", "alpha_strategies", "alpha_backtest", "alpha_validation", "alpha_forecast", "alpha_options", "alpha_screener", "alpha_research", "alpha_cli", "alpha_mcp", "alpha_web"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
# scripts/ on the search path so tests (and the harness gate step) resolve the
# top-level `gate` / `claude_hooks` / `harness_models` modules under scripts/.
mypy_path = ["scripts"]
exclude = '(^|/)_vendor/'

[[tool.mypy.overrides]]
# nautilus_trader ships py.typed, but its Cython extension submodules (model.data,
# model.objects, ...) carry no stubs mypy can load — treat those imports as untyped.
module = ["nautilus_trader.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scipy ships no mypy-loadable stubs (the separate scipy-stubs package is optional and
# strict-mode-noisy); we use only scipy.stats.norm for exact normal CDF/quantiles in BCa.
module = ["scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# quantstats-lumi (the numpy-2-safe quantstats fork) ships no stubs; it's used only at the
# tear-sheet rendering edge (alpha_validation.tearsheet). pandas itself is typed via pandas-stubs.
module = ["quantstats_lumi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# vendored upstream Kronos model code (pinned; MIT) is not strict-clean and is excluded from
# analysis above — skip import-following so the alpha_forecast facade sees it as untyped,
# exactly like the nautilus Cython modules.
module = ["alpha_forecast._vendor.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# finnhub-python ships no mypy-loadable stubs; it's imported lazily at the one screener network
# edge (alpha_screener.finnhub) and the client's dynamic methods are already `type: ignore`-d there.
module = ["finnhub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
pythonpath = [".", "scripts"]
markers = [
    "bias_guard: tests that mechanically prevent look-ahead / survivorship bias (gated in CI)",
    "network: tests that hit the live network (skipped in CI / offline runs)",
    "oracle: fast metamorphic / differential oracle tests over statistical primitives",
    "slow_oracle: known-truth calibration and coverage oracles (nightly + on-touch of quant modules)",
    "holdout: hidden behaviour tests the authoring agent never reads or edits (tests/holdout)",
]
filterwarnings = [
    "error",
    "ignore:The set_bad function will be deprecated.*:PendingDeprecationWarning:seaborn.matrix",
    "ignore:vert.*deprecated.*:matplotlib.MatplotlibDeprecationWarning:seaborn.categorical",
]

[tool.coverage.run]
source = [
    "alpha_core",
    "alpha_data",
    "alpha_strategies",
    "alpha_backtest",
    "alpha_validation",
    "alpha_forecast",
    "alpha_options",
    "alpha_screener",
    "alpha_research",
    "alpha_cli",
    "alpha_mcp",
    "alpha_web",
]
omit = [
    "*/alpha_forecast/_vendor/*",
    "*/alpha_web/static/*",
]

[tool.coverage.report]
fail_under = 93
precision = 2
show_missing = true
skip_covered = true

[tool.importlinter]
root_packages = [
    "alpha_core",
    "alpha_patterns",
    "alpha_data",
    "alpha_strategies",
    "alpha_backtest",
    "alpha_validation",
    "alpha_forecast",
    "alpha_options",
    "alpha_patterns",
    "alpha_screener",
    "alpha_research",
    "alpha_cli",
    "alpha_mcp",
    "alpha_web",
]

[[tool.importlinter.contracts]]
name = "alpha_core imports nothing internal"
type = "forbidden"
source_modules = ["alpha_core"]
forbidden_modules = ["alpha_patterns", "alpha_data", "alpha_strategies", "alpha_backtest", "alpha_validation", "alpha_forecast", "alpha_options", "alpha_screener", "alpha_research", "alpha_cli"]

[[tool.importlinter.contracts]]
name = "alpha_data depends only on core"
type = "forbidden"
source_modules = ["alpha_data"]
forbidden_modules = ["alpha_patterns", "alpha_strategies", "alpha_backtest", "alpha_validation", "alpha_forecast", "alpha_options", "alpha_screener", "alpha_research", "alpha_cli"]

[[tool.importlinter.contracts]]
name = "alpha_strategies depends only on core"
type = "forbidden"
source_modules = ["alpha_strategies"]
forbidden_modules = ["alpha_patterns", "alpha_data", "alpha_backtest", "alpha_validation", "alpha_forecast", "alpha_options", "alpha_screener", "alpha_research", "alpha_cli"]

[[tool.importlinter.contracts]]
name = "alpha_validation depends only on core"
type = "forbidden"
source_modules = ["alpha_validation"]
forbidden_modules = ["alpha_patterns", "alpha_data", "alpha_strategies", "alpha_backtest", "alpha_forecast", "alpha_options", "alpha_screener", "alpha_research", "alpha_cli"]

[[tool.importlinter.contracts]]
name = "alpha_backtest depends only on core + data"
type = "forbidden"
source_modules = ["alpha_backtest"]
forbidden_modules = ["alpha_patterns", "alpha_strategies", "alpha_validation", "alpha_forecast", "alpha_options", "alpha_screener", "alpha_research", "alpha_cli"]

[[tool.importlinter.contracts]]
name = "alpha_forecast depends only on core"
type = "forbidden"
source_modules = ["alpha_forecast"]
forbidden_modules = ["alpha_patterns", "alpha_data", "alpha_strategies", "alpha_backtest", "alpha_validation", "alpha_options", "alpha_screener", "alpha_research", "alpha_cli"]

[[tool.importlinter.contracts]]
name = "alpha_options depends only on core"
type = "forbidden"
source_modules = ["alpha_options"]
forbidden_modules = ["alpha_patterns", "alpha_data", "alpha_strategies", "alpha_backtest", "alpha_validation", "alpha_forecast", "alpha_screener", "alpha_research", "alpha_cli"]

[[tool.importlinter.contracts]]
name = "alpha_screener depends only on core"
type = "forbidden"
source_modules = ["alpha_screener"]
forbidden_modules = ["alpha_patterns", "alpha_data", "alpha_strategies", "alpha_backtest", "alpha_validation", "alpha_forecast", "alpha_options", "alpha_research", "alpha_cli"]

[[tool.importlinter.contracts]]
name = "alpha_research depends only on core"
type = "forbidden"
source_modules = ["alpha_research"]
forbidden_modules = ["alpha_data", "alpha_strategies", "alpha_backtest", "alpha_validation", "alpha_forecast", "alpha_options", "alpha_screener", "alpha_cli", "alpha_mcp", "alpha_web"]

[[tool.importlinter.contracts]]
name = "alpha_mcp sits atop the DAG (nothing imports it)"
type = "forbidden"
source_modules = ["alpha_core", "alpha_data", "alpha_strategies", "alpha_backtest", "alpha_validation", "alpha_forecast", "alpha_options", "alpha_screener", "alpha_research", "alpha_cli"]
forbidden_modules = ["alpha_mcp"]

[[tool.importlinter.contracts]]
name = "alpha_web sits atop the DAG (nothing imports it)"
type = "forbidden"
source_modules = ["alpha_core", "alpha_data", "alpha_strategies", "alpha_backtest", "alpha_validation", "alpha_forecast", "alpha_options", "alpha_screener", "alpha_research", "alpha_cli", "alpha_mcp"]
forbidden_modules = ["alpha_web"]

[[tool.importlinter.contracts]]
name = "alpha_mcp imports only public platform surfaces"
type = "forbidden"
source_modules = ["alpha_mcp"]
forbidden_modules = ["alpha_patterns", "alpha_data", "alpha_strategies", "alpha_backtest", "alpha_validation", "alpha_forecast", "alpha_options", "alpha_screener", "alpha_research", "alpha_web"]

[[tool.importlinter.contracts]]
name = "alpha_web imports only public platform surfaces"
type = "forbidden"
source_modules = ["alpha_web"]
forbidden_modules = ["alpha_patterns", "alpha_data", "alpha_strategies", "alpha_backtest", "alpha_validation", "alpha_forecast", "alpha_options", "alpha_screener", "alpha_research", "alpha_mcp"]
# Exact in-process cryptographic seam accepted by ADR-0030. It owns WebAuthn verification and
# narrow control-store persistence; no other alpha_cli module becomes a transitive web exemption.
ignore_imports = ["alpha_web.api.owner_auth -> alpha_cli.owner_auth"]

[[tool.importlinter.contracts]]
name = "alpha_patterns depends only on core"
type = "forbidden"
source_modules = ["alpha_patterns"]
forbidden_modules = ["alpha_data", "alpha_strategies", "alpha_backtest", "alpha_validation", "alpha_forecast", "alpha_options", "alpha_screener", "alpha_research", "alpha_cli", "alpha_mcp", "alpha_web"]
