[project]
name = "project-alpha"
version = "1.0.0"
description = "Personal quantitative research platform (backtest + validation + paper)."
requires-python = ">=3.12"
dependencies = [
    "alpha-core",
    "alpha-data",
    "alpha-strategies",
    "alpha-backtest",
    "alpha-validation",
    "alpha-forecast",
    "alpha-patterns",
    "alpha-research",
    "alpha-study",
    "alpha-cli",
    "alpha-mcp",
    "alpha-web",
]

[tool.uv]
package = false  # virtual workspace root; not itself an installable package

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
alpha-core = { workspace = true }
alpha-data = { workspace = true }
alpha-strategies = { workspace = true }
alpha-backtest = { workspace = true }
alpha-validation = { workspace = true }
alpha-forecast = { workspace = true }
alpha-patterns = { workspace = true }
alpha-research = { workspace = true }
alpha-study = { workspace = true }
alpha-cli = { workspace = true }
alpha-mcp = { workspace = true }
alpha-web = { workspace = true }
# CI (ubuntu) must never resolve CUDA torch wheels (~2.5GB + nvidia-* deps); macOS PyPI
# wheels are already CPU+MPS, so the CPU index is gated to linux only.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest==9.1.0",
    "hypothesis>=6",
    "mypy==2.1.0",
    "ruff==0.15.17",
    "import-linter>=2.1",
    "pandas-stubs>=2.0",
    "pytest-cov>=6",
    "pytest-xdist>=3.6",
    "httpx2>=0.1",
    "diff-cover==11.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# vendored upstream Kronos model code is pinned verbatim (see alpha_forecast._vendor) — not ours to
# style; the Workstation SPA source (apps/alpha-web/frontend) is TypeScript, linted by its own npm
# toolchain, not ruff — its built assets go to src/alpha_web/static/app (built, not committed).
extend-exclude = [
    "packages/alpha-forecast/src/alpha_forecast/_vendor",
    "apps/alpha-web/frontend",
]

[tool.ruff.lint]
# DTZ: every read is at an aware-UTC as_of, so a naive datetime is a bug. DTZ007 (strptime) and
# DTZ011 (date.today) each had one product hit; both are now fixed and enabled.
select = [
    "E", "F", "I", "B", "UP", "SIM", "RUF100",
    "DTZ001", "DTZ002", "DTZ003", "DTZ004", "DTZ005", "DTZ006", "DTZ007", "DTZ011", "DTZ012",
    "TID251",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.utcnow".msg = "Use datetime.now(UTC); every read is point-in-time at an aware-UTC as_of."
"datetime.datetime.utcfromtimestamp".msg = "Use datetime.fromtimestamp(ts, UTC); every read is point-in-time at an aware-UTC as_of."
"atexit.register".msg = "Do not hook a run's ending with atexit.register; a run must end by its own result."
"os._exit".msg = "Do not end a run by calling os._exit; a run must end by its own result."
"numpy.random.seed".msg = "Pass the seed to numpy.random.default_rng(seed); seeds and fingerprints are deterministic and local."
"numpy.random.RandomState".msg = "Use numpy.random.default_rng(seed); seeds and fingerprints are deterministic and local."

[tool.ruff.lint.per-file-ignores]
# Source bytes bound into runtime identities: the alpha_research tree feeds the research
# implementation "code" hash that owner-approved contracts are checked against, and these
# alpha_data modules feed comparison_acquisition._policy_hash. Their stale suppressions are
# kept so a lint-only cleanup does not change those identities.
"packages/alpha-research/src/alpha_research/**" = ["RUF100"]
# Tests and scripts build fixtures and stamp tools with local clocks and may ban-test the APIs.
"tests/**" = ["DTZ", "TID251"]
"scripts/**" = ["DTZ", "TID251"]
"packages/alpha-data/src/alpha_data/pipeline.py" = ["RUF100"]
"packages/alpha-data/src/alpha_data/snapshot.py" = ["RUF100"]
"packages/alpha-data/src/alpha_data/adapters/tiingo_adapter.py" = ["RUF100"]

[tool.ruff.lint.isort]
known-first-party = ["alpha_core", "alpha_patterns", "alpha_data", "alpha_strategies", "alpha_backtest", "alpha_validation", "alpha_forecast", "alpha_research", "alpha_study", "alpha_cli", "alpha_mcp", "alpha_web"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
# scripts/ on the search path so tests (and the harness gate step) resolve the
# top-level `gate` / `claude_hooks` / `harness_models` modules under scripts/.
mypy_path = ["scripts"]
exclude = '(^|/)_vendor/'

[[tool.mypy.overrides]]
# nautilus_trader ships py.typed, but its Cython extension submodules (model.data,
# model.objects, ...) carry no stubs mypy can load — treat those imports as untyped.
module = ["nautilus_trader.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scipy ships no mypy-loadable stubs (the separate scipy-stubs package is optional and
# strict-mode-noisy); we use only scipy.stats.norm for exact normal CDF/quantiles in BCa.
module = ["scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# quantstats-lumi (the numpy-2-safe quantstats fork) ships no stubs; it's used only at the
# tear-sheet rendering edge (alpha_validation.tearsheet). pandas itself is typed via pandas-stubs.
module = ["quantstats_lumi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# STUMPY ships no stubs; it is imported only in alpha_patterns.lookalike (ADR-0051).
module = ["stumpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# statsmodels ships no stubs (owner decision 2026-11-17: use it as an untyped library);
# it supplies the Holm adjustment and the market-attribution regressions in alpha_validation.
module = ["statsmodels.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ruptures ships no stubs (owner decision 2026-11-17: use it as an untyped library);
# it is used only for change-point detection in alpha_validation.
module = ["ruptures.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# vendored upstream Kronos model code (pinned; MIT) is not strict-clean and is excluded from
# analysis above — skip import-following so the alpha_forecast facade sees it as untyped,
# exactly like the nautilus Cython modules.
module = ["alpha_forecast._vendor.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
pythonpath = [".", "scripts"]
markers = [
    "bias_guard: tests that mechanically prevent look-ahead / survivorship bias (gated in CI)",
    "network: tests that hit the live network (skipped in CI / offline runs)",
    "oracle: fast metamorphic / differential oracle tests over statistical primitives",
    "slow_oracle: known-truth calibration and coverage oracles (nightly + on-touch of quant modules)",
    "smoke: end-to-end workflow checks that run the installed alpha / alpha-web programs in a temporary home (tests/smoke)",
    "platform: control-plane / serving / wire-parser / harness tests, applied by tests/conftest.py from tests/_tiers.py; the fast gate runs `not platform`",
]
filterwarnings = [
    "error",
    "ignore:The set_bad function will be deprecated.*:PendingDeprecationWarning:seaborn.matrix",
    "ignore:vert.*deprecated.*:matplotlib.MatplotlibDeprecationWarning:seaborn.categorical",
]

[tool.coverage.run]
source = [
    "alpha_core",
    "alpha_data",
    "alpha_patterns",
    "alpha_strategies",
    "alpha_backtest",
    "alpha_validation",
    "alpha_forecast",
    "alpha_research",
    "alpha_study",
    "alpha_cli",
    "alpha_mcp",
    "alpha_web",
]
omit = [
    "*/alpha_forecast/_vendor/*",
    "*/alpha_web/static/*",
]

[tool.coverage.report]
# No global floor: CI reports the whole-suite figure and gates changed lines instead
# ([tool.diff_cover] below, docs/reference/checks.md).
precision = 2
show_missing = true
skip_covered = true

[tool.diff_cover]
# Changed lines of product source in a pull request must be at least this covered. The number
# is guarded by `gate.py lint-harness` against .claude/harness-baseline.json.
fail_under = 85
include = ["packages/*/src/**/*.py", "apps/*/src/**/*.py"]

[tool.importlinter]
root_packages = [
    "alpha_core",
    "alpha_patterns",
    "alpha_data",
    "alpha_strategies",
    "alpha_backtest",
    "alpha_validation",
    "alpha_forecast",
    "alpha_research",
    "alpha_study",
    "alpha_cli",
    "alpha_mcp",
    "alpha_web",
]

[[tool.importlinter.contracts]]
name = "alpha_core imports nothing internal"
type = "forbidden"
source_modules = ["alpha_core"]
forbidden_modules = ["alpha_patterns", "alpha_data", "alpha_strategies", "alpha_backtest", "alpha_validation", "alpha_forecast", "alpha_research", "alpha_study", "alpha_cli"]

[[tool.importlinter.contracts]]
name = "alpha_data depends only on core"
type = "forbidden"
source_modules = ["alpha_data"]
forbidden_modules = ["alpha_patterns", "alpha_strategies", "alpha_backtest", "alpha_validation", "alpha_forecast", "alpha_research", "alpha_study", "alpha_cli"]

[[tool.importlinter.contracts]]
name = "alpha_strategies depends only on core and patterns"
type = "forbidden"
source_modules = ["alpha_strategies"]
forbidden_modules = ["alpha_data", "alpha_backtest", "alpha_validation", "alpha_forecast", "alpha_research", "alpha_study", "alpha_cli"]

[[tool.importlinter.contracts]]
name = "alpha_validation depends only on core"
type = "forbidden"
source_modules = ["alpha_validation"]
forbidden_modules = ["alpha_patterns", "alpha_data", "alpha_strategies", "alpha_backtest", "alpha_forecast", "alpha_research", "alpha_study", "alpha_cli"]

[[tool.importlinter.contracts]]
name = "alpha_backtest depends only on core + data"
type = "forbidden"
source_modules = ["alpha_backtest"]
forbidden_modules = ["alpha_patterns", "alpha_strategies", "alpha_validation", "alpha_forecast", "alpha_research", "alpha_study", "alpha_cli"]

[[tool.importlinter.contracts]]
name = "alpha_forecast depends only on core"
type = "forbidden"
source_modules = ["alpha_forecast"]
forbidden_modules = ["alpha_patterns", "alpha_data", "alpha_strategies", "alpha_backtest", "alpha_validation", "alpha_research", "alpha_study", "alpha_cli"]

[[tool.importlinter.contracts]]
name = "alpha_research depends only on core"
type = "forbidden"
source_modules = ["alpha_research"]
forbidden_modules = ["alpha_patterns", "alpha_data", "alpha_strategies", "alpha_backtest", "alpha_validation", "alpha_forecast", "alpha_study", "alpha_cli", "alpha_mcp", "alpha_web"]

[[tool.importlinter.contracts]]
name = "alpha_mcp sits atop the DAG (nothing imports it)"
type = "forbidden"
source_modules = ["alpha_core", "alpha_data", "alpha_strategies", "alpha_backtest", "alpha_validation", "alpha_forecast", "alpha_research", "alpha_study", "alpha_cli"]
forbidden_modules = ["alpha_mcp"]

[[tool.importlinter.contracts]]
name = "alpha_web sits atop the DAG (nothing imports it)"
type = "forbidden"
source_modules = ["alpha_core", "alpha_data", "alpha_strategies", "alpha_backtest", "alpha_validation", "alpha_forecast", "alpha_research", "alpha_study", "alpha_cli", "alpha_mcp"]
forbidden_modules = ["alpha_web"]

[[tool.importlinter.contracts]]
name = "alpha_mcp imports only public platform surfaces"
type = "forbidden"
source_modules = ["alpha_mcp"]
forbidden_modules = ["alpha_patterns", "alpha_data", "alpha_strategies", "alpha_backtest", "alpha_validation", "alpha_forecast", "alpha_research", "alpha_study", "alpha_web"]

[[tool.importlinter.contracts]]
name = "alpha_web imports only public platform surfaces"
type = "forbidden"
source_modules = ["alpha_web"]
forbidden_modules = ["alpha_patterns", "alpha_data", "alpha_strategies", "alpha_backtest", "alpha_validation", "alpha_forecast", "alpha_research", "alpha_study", "alpha_mcp"]

[[tool.importlinter.contracts]]
name = "alpha_patterns depends only on core"
type = "forbidden"
source_modules = ["alpha_patterns"]
forbidden_modules = ["alpha_data", "alpha_strategies", "alpha_backtest", "alpha_validation", "alpha_forecast", "alpha_research", "alpha_study", "alpha_cli", "alpha_mcp", "alpha_web"]

[[tool.importlinter.contracts]]
name = "alpha_study composes only research-plane primitives"
type = "forbidden"
source_modules = ["alpha_study"]
forbidden_modules = ["alpha_strategies", "alpha_backtest", "alpha_validation", "alpha_forecast", "alpha_cli", "alpha_mcp", "alpha_web"]

[[tool.importlinter.contracts]]
# The kept features (final check, `alpha test`, `alpha setup`, the trial ledger, durable jobs) stand
# on `home_db` and never reach the old research-case machinery, so it can be deleted without
# touching them. A step that deletes one of the forbidden modules drops its name from this list.
name = "kept features stand off the old research-case machinery"
type = "forbidden"
source_modules = [
    "alpha_cli.confirm_cmds", "alpha_cli.test_cmds", "alpha_cli.setup_cmds", "alpha_cli.ledger_cmds",
    "alpha_cli.next_cmds", "alpha_cli.reserved_slots", "alpha_cli.spine", "alpha_cli._rdagent_ledger",
    "alpha_cli.home_db", "alpha_cli.job_store", "alpha_cli.job_rows", "alpha_cli.durable_lease",
    "alpha_cli.job_capacity",
]
forbidden_modules = [
    "alpha_cli.native_supervisor",
    "alpha_cli._native_fixture_store", "alpha_cli._native_daily_rule_artifacts",
    "alpha_cli._native_daily_rule_container", "alpha_cli._native_daily_rule_projection",
    "alpha_cli._native_daily_rule_restore", "alpha_cli._native_daily_rule_history",
    "alpha_cli._native_loop_admission", "alpha_cli._native_rule_artifacts",
    "alpha_cli._native_rule_completion", "alpha_cli._native_rule_projection",
    "alpha_cli._native_rule_environment", "alpha_cli._native_rule_authority",
    "alpha_cli._native_stock_launch", "alpha_cli.native_stock_fixture",
    "alpha_cli.daily_native_cmds",
    "alpha_cli._native_rule_protocol", "alpha_cli._native_daily_rule_protocol",
    "alpha_cli._native_daily_rule_study", "alpha_cli._native_rule_study",
    "alpha_cli._native_rule_economics", "alpha_cli._native_daily_rule_identity",
    "alpha_cli.owner_auth", "alpha_cli.research_cmds",
    "alpha_cli._research_cmd_parts", "alpha_cli.research_intake", "alpha_cli.research_execution",
    "alpha_cli.research_execution_digest", "alpha_cli.research_diagnostic_cmds",
    "alpha_cli.research_dossier", "alpha_cli.research_suggestions",
    "alpha_cli.research_study_status", "alpha_cli.research_workflow_contract",
    "alpha_cli.research_compare", "alpha_cli.local_pdf_cmds", "alpha_cli.research_d1",
    "alpha_cli.research_d2", "alpha_cli.research_runtime", "alpha_cli.research_crypto_runtime",
    "alpha_cli.research_crypto_d2", "alpha_cli.research_crypto_binding",
    "alpha_cli.research_readiness", "alpha_cli.research_data_audit",
    "alpha_cli.research_gate_packet", "alpha_cli.study_semantic",
    "alpha_cli._research_artifact_io", "alpha_cli.paper_resources", "alpha_cli.control_store",
    "alpha_cli._control_schema", "alpha_cli._control_json", "alpha_cli._ml_observation_store",
    "alpha_cli.ml_native_plan", "alpha_cli._structural_digest",
]

# The layers inside alpha_cli, from the bottom: core (`_*`) and store modules, then figures and
# toolbox, then spine, then the command files (`*_cmds`). The two fences below stop new direct imports
# that go down-to-up. Each `ignore_imports` entry is one direct import that existed when the fence
# was added; remove the entry when the import goes. Never add an entry. A new command file adds its
# name to both `forbidden_modules` lists.
[[tool.importlinter.contracts]]
name = "spine imports no toolbox, figures or command file directly"
type = "forbidden"
source_modules = ["alpha_cli.spine"]
forbidden_modules = [
    "alpha_cli.toolbox", "alpha_cli.figures",
    "alpha_cli.assistant_cmds", "alpha_cli.backtest_cmds", "alpha_cli.chart_cmds",
    "alpha_cli.confirm_cmds", "alpha_cli.context_cmds", "alpha_cli.context_derived_cmds",
    "alpha_cli.context_free_cmds", "alpha_cli.context_sources_cmds", "alpha_cli.crypto_data_cmds",
    "alpha_cli.daily_native_cmds", "alpha_cli.data_cmds", "alpha_cli.data_update_cmds",
    "alpha_cli.figures_cmds", "alpha_cli.follow_cmds", "alpha_cli.forecast_cmds",
    "alpha_cli.home_cmds", "alpha_cli.idea_cmds", "alpha_cli.info_cmds", "alpha_cli.jobs_cmds",
    "alpha_cli.labels_cmds", "alpha_cli.ledger_cmds", "alpha_cli.library_cmds",
    "alpha_cli.library_papers_cmds", "alpha_cli.local_pdf_cmds", "alpha_cli.lookalike_cmds",
    "alpha_cli.market_overview_cmds", "alpha_cli.ml_cmds", "alpha_cli.monte_carlo_cmds",
    "alpha_cli.next_cmds", "alpha_cli.nightly_cmds", "alpha_cli.optim_cmds",
    "alpha_cli.options_cmds", "alpha_cli.partner_cmds",
    "alpha_cli.propfirm_cmds", "alpha_cli.provider_cmds", "alpha_cli.rdagent_bench_cmds",
    "alpha_cli.rdagent_cmds", "alpha_cli.report_cmds", "alpha_cli.research_cmds",
    "alpha_cli.research_diagnostic_cmds", "alpha_cli.results_cmds", "alpha_cli.risk_cmds",
    "alpha_cli.rules_cmds", "alpha_cli.run_price_cmds", "alpha_cli.scan_cmds",
    "alpha_cli.setup_cmds", "alpha_cli.strategy_candidate_cmds", "alpha_cli.test_cmds",
    "alpha_cli.tool_cmds", "alpha_cli.validate_cmds",
]
allow_indirect_imports = true
ignore_imports = [
    "alpha_cli.spine.facts -> alpha_cli.toolbox.registry",
    "alpha_cli.spine.facts -> alpha_cli.toolbox.store",
    "alpha_cli.spine.trial_record -> alpha_cli.toolbox.registry",
    "alpha_cli.spine.idea_file -> alpha_cli.toolbox.declarations",
    "alpha_cli.spine.idea_file -> alpha_cli.figures",
    "alpha_cli.spine.event_study_figure -> alpha_cli.figures.direct_notes",
    "alpha_cli.spine.setup_trade_figure -> alpha_cli.figures.direct_notes",
    "alpha_cli.spine.diagnose -> alpha_cli.validate_cmds",
    "alpha_cli.spine.run -> alpha_cli.validate_cmds",
    "alpha_cli.spine.run -> alpha_cli.figures_cmds",
    "alpha_cli.spine.honesty -> alpha_cli.results_cmds",
]

[[tool.importlinter.contracts]]
# Core modules leave out the old research-case machinery listed in the contract above; that
# machinery is being deleted.
name = "toolbox, figures, core and store modules import no command file directly"
type = "forbidden"
source_modules = [
