[[capability]]
id = "forward-follow"
name = "Follow a tested idea on paper (alpha follow)"
what = "Follow a rule test or setup find forward on paper. The follow is frozen when it starts. An append-only, hash-chained journal records its sessions. A changed spec starts a new version. For a rule test, `alpha follow update` books one entry per new session: the rule's numbers, a plain decision and a paper fill at the next open, with a replay check against the stored bars."
