# Capability map: every user-facing workflow of ALPHA, in plain English.
#
# STATUS.md is generated from this file (uv run python scripts/status.py); the schema is
# enforced by scripts/capabilities.py and tests/unit/test_capabilities.py.
#
# Fields per [[capability]]:
#   id               kebab-case, unique
#   name             plain English name (shown first on owner pages)
#   codes            internal code names, shown in brackets after the name (optional)
#   what             one sentence: what it lets the owner do
#   see_it           exact command(s) or Workstation screen; "nothing to see yet — internal only"
#   entry_points     verified entry points, each "<kind>: <value>":
#                      cli: alpha <command>      (group must be registered in alpha_cli/main.py)
#                      api: <METHOD> /api/...    (route must exist in alpha_web/api/*.py)
#                      panel: <path to .tsx>     (file must exist)
#                      script: <console script>  (must be declared in an apps/*/pyproject.toml)
#                      code: <path>              (internal module; file must exist)
#   proof_synthetic  node ids of tests of the workflow on synthetic data, run in-process or in a
#                    browser against a test server ("path::test name"); [] means there is none
#   proof_smoke      node ids under tests/smoke/ that run the workflow from start to finish
#                    through the installed alpha / alpha-web programs in a throwaway home
#                    (optional; a node skipped or xfailed by design proves nothing)
#   real_data        whether a run on real market data is recorded
#   real_data_needs  what a real-data run would need (credentials, network); optional
#   needs            things this workflow needs that the development machine does not have
#   state            Working | Partial | Demo only | Shelved | Not started
#                    Working = at least one proof_smoke node that is not skipped or xfailed by
#                    design, and needs is empty; in-process tests alone make it at most Partial
#   missing          a few words on what stops it being Working (required unless Working);
#                    "tested in-process only; no end-to-end smoke check yet" when only
#                    proof_synthetic exists (the page lists those together)
#   triage           {card, recommendation, owner_decision} for items on the triage sheet;
#                    owner_decision is "undecided" until the owner answers (TOML has no null)
#   plans            live plans (docs/superpowers/plans/*.md file names) that belong to it
#   docs             plain-English documents for the owner (repo-relative .md paths; optional)
#
# [[decision]] holds triage cards that are not a workflow of their own; [[unassigned_plan]] holds
# live plans that belong to no workflow; [[plan_summary]] gives every "In progress" plan a plain
# title and one line for STATUS.md. [[known_defect]] lists each strict-xfail smoke check with a
# plain title, its node and how to see the defect; every xfail under tests/smoke/ must be listed.

