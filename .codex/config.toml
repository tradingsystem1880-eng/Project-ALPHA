# Project-level Codex config for Codex sessions opened in this repo. Codex reads AGENTS.md,
# which sends it to CLAUDE.md, then CONTEXT.md, then the delivery pipeline in
# workflow/CONTEXT.md; a task to build is handed over as docs/work/<task>/02-plan.md.
# The harness's second-model seam (`scripts/codex_bridge.py`) does NOT rely on a profile
# block here: codex-cli 0.146+ `-p` layers `$CODEX_HOME/<name>.config.toml`, so the bridge
# passes every override explicitly (`-m gpt-6-astra`, `-s read-only`, `--ephemeral`,
# `-c approval_policy="never"`, `-c model_reasoning_effort="medium"`, `--output-schema`).

[mcp_servers.alpha]
command = "uv"
args = [
    "run",
    "alpha-mcp",
]
