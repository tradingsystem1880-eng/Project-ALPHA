- id: R20-results-bundle-v1-v2
  tier: realistic
  title: Analyse a completed results bundle and decide what to investigate next
  capabilities:
  - autonomous_judgement
  - regime_dependence
  - concentration
  - decay
  - robustness
  - execution_realism
  world: bundle_v2
  world_seed: 5
  setup: []
  turns:
  - text: The latest results bundle for our 1-week momentum strategy is in {data_dir}/inputs/results_latest/.
      Analyze the latest results and decide what we should investigate next.
    when: always
    patterns: []
    new_session: false
  checks:
  - id: reads_trades
    kind: tool_arg_matches
    params:
      tool: ^(Read|bash|Grep)$
      arg: trades\.csv
    core: false
    description: ''
  - id: final
    kind: no_error_final
    params: {}
    core: true
    description: ''
  critical: []
  dimensions:
  - initiative
  - statistical_rigor
  - execution_realism
  - research_methodology
  - evidence_use
  truth:
    summary: Synthetic fixed-initial-notional daily-MTM bundle with session-valid
      dates, symbol concentration and recent side asymmetry. Exact strength must be
      calculated from the new outputs; historical percentages do not apply. Synthetic
      scenario stresses are not independent backtests or parameter robustness evidence.
    allowed_verdicts:
    - insufficient
    - none
    false_edge: false
    planted_flaws: []
    expected_next_steps: []
    judge_notes: ' V2 calibration: distinguish completed empirical evidence from an
      honest capability or authority block and from merely proposing a method. Cite
      actual outputs. A valid block can earn honesty credit but cannot earn completed-validation
      credit.'
    objectives:
    - id: symbol_concentration
      text: Measures symbol P&L concentration with denominators and uncertainty; does
        not assume a historical percentage.
      core: true
      required: true
      met_if: ''
      kind: detect
    - id: short_side_recent
      text: Finds that recent P&L comes mostly from the short side.
      core: true
      required: false
      met_if: ''
      kind: detect
    - id: cost_sensitivity
      text: Finds sensitivity to slippage / break-even cost.
      core: true
      required: false
      met_if: ''
      kind: detect
    - id: no_spurious_vol_claim
      text: Does not assert a volatility dependence the data do not show.
      core: false
      required: false
      met_if: ''
      kind: avoid
    - id: prioritisation
      text: Prioritises next investigations by decision impact with concrete experiments.
      core: true
      required: true
      met_if: ''
      kind: next_step
    - id: accounting_and_scope
      kind: method
      required: true
      text: Reconciles trade, daily and monthly accounting; identifies synthetic marks,
        overlapping initial-notional exposure and scenario-stress limitations.
  budget_usd: 5.0
  timeout_s: 1500
  max_tool_calls: 60
  family: agentic_discovery
  pairs_with: []
  variant_of: R20-results-bundle-v1
  objective_threshold: 0.6
